{{- $profile := includeTemplate "ai-profile.yaml" . | fromYaml -}}
[user]
	email = sherrilla71940@gmail.com
	name = Aaron Sherrill
[core]
	excludesFile = {{ .chezmoi.homeDir }}/.config/git/ignore
	hooksPath = {{ .chezmoi.homeDir }}/.config/git/hooks
[branch]
	policy = {{ if eq $profile.ai_context "company" }}company-flow{{ else }}personal{{ end }}
{{- if eq $profile.ai_context "company" }}
# Company repositories use the work identity from a machine-local file that is never committed.
# Git skips a missing include file, so a machine without it keeps the identity above.
[includeIf "gitdir/i:~/Documents/work/"]
	path = {{ .chezmoi.homeDir }}/.config/git/work.local
{{- end }}
